services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SVCDESK_TEST_CLOCK=1
      - KB_INDEX_URL=http://kb-index:8080
    depends_on:
      - kb-index
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: "wojbra1993"
    ports:
      - "8081:8080"
  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile.tests
    network_mode: none
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["gap"]
    ports:
      - "127.0.0.1:8474:8474"
      - "8666:8666"
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

services:
  ollama:
    image: ollama/ollama:0.40.2
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  capture:
    build: .
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5:0.5b
      TRACE_OUTPUT_DIR: /output
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - .:/output

volumes:
  models:
